name: Deploy to Railway

# Manual only — requires RAILWAY_TOKEN in GitHub repo secrets.
# Do not run on push: a failed deploy job can skip Railway autodeploy when Wait for CI is on.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy latest commit to Railway
        run: railway up --detach --service script-assembler
