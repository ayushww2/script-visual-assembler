name: Deploy to Railway

# Requires RAILWAY_TOKEN in GitHub repo secrets (Settings → Secrets → Actions).
# Manual trigger only — avoids failed deploy blocking Railway Wait-for-CI autodeploy.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy latest commit to Railway
        run: railway up --detach --service script-assembler
